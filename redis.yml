# docker compose --env-file .env.redis --env-file .env.network -f redis.yml up -d
services:
  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - gldev

networks:
  gldev:
    name: ${NETWORK_NAME}
    external: true
